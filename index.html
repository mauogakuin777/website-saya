<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff6f7">
  <title>Pertanyaan untukmu, Ningsih</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="floating-heart heart-one" aria-hidden="true">♥</div>
    <div class="floating-heart heart-two" aria-hidden="true">♥</div>
    <section class="quiz-card" aria-labelledby="page-title">
      <header class="quiz-header">
        <span class="heart-badge" aria-hidden="true">♥</span>
        <p class="eyebrow">SEBUAH KUIS KECIL</p>
        <h1 id="page-title">Pertanyaan untukmu,<br><span>Ningsih</span></h1>
        <p class="intro">Seberapa baik kamu mengingat cerita kita? Jawab semua pertanyaan ini, ya 💕</p>
      </header>

      <section id="quiz-panel" aria-live="polite">
        <div class="progress-info">
          <span id="question-number">Pertanyaan 1 dari 3</span>
          <span id="score-label">Skor: 0</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <h2 id="question-text" class="question"></h2>
        <div id="answer-options" class="answer-options"></div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <button id="next-button" class="next-button" type="button" disabled>Pilih jawaban dulu</button>
      </section>

      <section id="result-panel" class="result-panel" hidden aria-live="polite">
        <span id="result-heart" class="result-heart" aria-hidden="true">♥</span>
        <p class="eyebrow">KUIS SELESAI</p>
        <h2 id="result-title"></h2>
        <p id="result-message" class="result-message"></p>
        <p id="final-score" class="final-score"></p>
        <button id="restart-button" class="next-button" type="button">Main lagi</button>
      </section>
    </section>
    <p class="signature">Dibuat dengan sepenuh hati <span aria-hidden="true">♥</span></p>
  </main>
</body>
</html>
